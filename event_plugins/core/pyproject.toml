[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davidia-event-core"
dynamic = ["version"]
description = "Core event plugins for Davidia's PlotServer"
readme = "README.md"
license = "MIT"
maintainers = [
    { name = "Data Analysis group", email = "dataanalysis@diamond.ac.uk" },
]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">= 3.12"
dependencies = ["h5py", "davidia", "numpy"]

[project.urls]
repository = "https://github.com/DiamondLightSource/davidia-plugins"

[tool.setuptools.dynamic]
version = { attr = "davidia.event.core.__version__" }

[tool.setuptools.package-dir]
"davidia.event" = "davidia.event_plugins"
"davidia.source" = "davidia.source_plugins"

[project.entry-points."davidia.plugins"]
davidia-profile = "core.plugins:DavidiaProfilePlugin"
davidia-box = "core.plugins:BoxProfilePlugin"
davidia-axis = "core.plugins:AxisProfilePlugin"
davidia-integration = "core.plugins:AxisIntegrationPlugin"
davidia-sum = "core.plugins:IntersectionSumPlugin"
davidia-nxs-source = "source_plugins.core.plugins:NXSImageSourcePlugin"


[tool.setuptools.package-data]
"*" = ["*.png"]

[tool.pytest.ini_options]
log_cli = true
asyncio_default_fixture_loop_scope = "class"

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501", "W505", "C408"]
extend-select = ["I001"]

[tool.ruff.lint.mccabe]
max-complexity = 10
